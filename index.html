<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GeoPixels archive</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.css">
  <style>
    html,body,#map{height:100%;margin:0} body{font:14px system-ui,sans-serif}
    #controls{position:absolute;z-index:2;top:10px;left:10px;display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:6px;background:#fffffff0;box-shadow:0 1px 5px #0005}
    select{font:inherit;max-width:220px} #status{color:#555;font-variant-numeric:tabular-nums}
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="controls"><strong>GeoPixels</strong><label>Version <select id="version"></select></label><span id="status">Loading…</span></div>
  <script src="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.js"></script>
  <script src="/pixel-tile-layer.js"></script>
  <script>
    const gridSize=25,tileSize=256,maxDataZoom=13,earthRadius=6378137,mercatorHalfWorld=Math.PI*earthRadius;
    const params=new URLSearchParams(location.search);
    const select=document.querySelector('#version'),status=document.querySelector('#status');
    let pixelTileLayer=null,archiveVersion=null,refreshGeneration=0,refreshController=null,displayedLevel=null,lastViewportSignature='';
    const maxCachedTiles=256;
    const fallbackDelayMs=300;
    const tileLoadConcurrency=4;
    const moveRefreshDelayMs=100;
    const tileUsage=new Map();
    const missingTiles=new Set();
    let usageTick=0,moveRefreshTimer=0;
    const map=new maplibregl.Map({container:'map',center:[+(params.get('lng')||0),+(params.get('lat')||0)],zoom:+(params.get('zoom')||1),renderWorldCopies:true,style:'/map-style.json'});
    map.addControl(new maplibregl.NavigationControl());

    const clamp=(value,min,max)=>Math.max(min,Math.min(max,value));
    const cellsPerTile=z=>tileSize*Math.pow(2,maxDataZoom-z);
    const lngToMercatorX=lng=>clamp(lng/180*mercatorHalfWorld,-mercatorHalfWorld,mercatorHalfWorld);
    const latToMercatorY=lat=>{
      const radians=clamp(lat,-85.05112878,85.05112878)*Math.PI/180;
      return earthRadius*Math.log(Math.tan(Math.PI/4+radians/2));
    };
    function projectedToLngLat(mx,my){
      return [mx/earthRadius*180/Math.PI,(2*Math.atan(Math.exp(my/earthRadius))-Math.PI/2)*180/Math.PI];
    }
    function nativeTileRange(bounds,z){
      const span=cellsPerTile(z);
      const west=lngToMercatorX(bounds.getWest()),east=lngToMercatorX(bounds.getEast());
      const south=latToMercatorY(bounds.getSouth()),north=latToMercatorY(bounds.getNorth());
      const tileFor=(mx,my)=>[Math.floor((mx/gridSize+0.5)/span),Math.floor((my/gridSize+0.5)/span)];
      const [minX,minY]=tileFor(Math.min(west,east),south),[maxX,maxY]=tileFor(Math.max(west,east),north);
      return {minX:minX-1,maxX:maxX+1,minY:minY-1,maxY:maxY+1};
    }
    function visibleNativeTiles(bounds,z){
      const tiles=[],west=bounds.getWest(),east=bounds.getEast()<west?bounds.getEast()+360:bounds.getEast();
      const firstWorld=Math.floor((bounds.getWest()+180)/360),lastWorld=Math.floor((east+180)/360);
      for(let world=firstWorld;world<=lastWorld;world++){
        const offset=world*360,worldWest=-180+offset,worldEast=180+offset;
        const localBounds={
          getWest:()=>Math.max(west,worldWest)-offset,
          getEast:()=>Math.min(east,worldEast)-offset,
          getSouth:()=>bounds.getSouth(),getNorth:()=>bounds.getNorth()
        };
        const range=nativeTileRange(localBounds,z);
        for(let x=range.minX;x<=range.maxX;x++)for(let y=range.minY;y<=range.maxY;y++)tiles.push({x,y,world});
      }
      return tiles;
    }
    function nativeTileCorners(z,x,y,world=0){
      const span=cellsPerTile(z),gx0=x*span,gy0=y*span;
      // Grid coordinates are cell centres, so native tile boundaries are half a cell outside.
      const west=(gx0-0.5)*gridSize,east=(gx0+span-0.5)*gridSize;
      const south=(gy0-0.5)*gridSize,north=(gy0+span-0.5)*gridSize;
      return [projectedToLngLat(west,south),projectedToLngLat(east,south),projectedToLngLat(east,north),projectedToLngLat(west,north)]
        .map(([lng,lat])=>[lng+world*360,lat]);
    }
    const dataLevel=()=>clamp(Math.ceil(map.getZoom())+1,0,maxDataZoom);
    function viewportSignature(){
      const z=dataLevel();
      return `${archiveVersion}/${z}/`+visibleNativeTiles(map.getBounds(),z).map(({x,y,world})=>`${x}/${y}@${world}`).join(',');
    }
    function scheduleTileRefresh(allowFallback){
      if(!pixelTileLayer||!archiveVersion)return;
      if(allowFallback){
        if(moveRefreshTimer){clearTimeout(moveRefreshTimer);moveRefreshTimer=0}
        lastViewportSignature=viewportSignature();refreshTiles(true);return;
      }
      if(moveRefreshTimer)return;
      moveRefreshTimer=setTimeout(()=>{
        moveRefreshTimer=0;
        const signature=viewportSignature();
        if(signature===lastViewportSignature)return;
        lastViewportSignature=signature;refreshTiles(false);
      },moveRefreshDelayMs);
    }

    async function fetchTileBlob(version,z,x,y,fetches,signal){
      const url=`/tiles/${version}/${z}/${x}/${y}.png`;
      if(missingTiles.has(url))return null;
      if(!fetches.has(url))fetches.set(url,(async()=>{
        const response=await fetch(url,{signal});
        if(response.status===404){
          missingTiles.add(url);
          if(missingTiles.size>5000)missingTiles.delete(missingTiles.values().next().value);
          return null;
        }
        if(!response.ok)throw new Error(`Tile ${z}/${x}/${y}: ${response.status}`);
        return response.blob();
      })());
      return fetches.get(url);
    }

    const floorMod=(value,divisor)=>((value%divisor)+divisor)%divisor;
    async function cropParentTile(blob,x,y,delta){
      const scale=Math.pow(2,delta),sourceSize=tileSize/scale;
      // Source PNG is north-up; native Y grows north, while bitmap crop Y grows down.
      const sourceX=floorMod(x,scale)*sourceSize,sourceY=(scale-1-floorMod(y,scale))*sourceSize;
      return createImageBitmap(blob,sourceX,sourceY,sourceSize,sourceSize,{
        imageOrientation:'flipY',resizeWidth:tileSize,resizeHeight:tileSize,resizeQuality:'pixelated'
      });
    }

    async function loadFallbackForTile(version,z,x,y,world,generation,fetches,signal){
      for(let delta=1;delta<=2&&z-delta>=0;delta++){
        const scale=Math.pow(2,delta),parentZ=z-delta,parentX=Math.floor(x/scale),parentY=Math.floor(y/scale);
        try{
          const blob=await fetchTileBlob(version,parentZ,parentX,parentY,fetches,signal);
          if(generation!==refreshGeneration)return null;
          if(!blob)continue;
          const bitmap=await cropParentTile(blob,x,y,delta);
          if(generation!==refreshGeneration){bitmap.close();return null}
          return {key:`fallback/${version}/${z}/${x}/${y}@${world}`,bitmap,corners:nativeTileCorners(z,x,y,world)};
        }catch(error){
          if(error.name!=='AbortError')console.error(error);
          if(signal.aborted)return null;
        }
      }
      return null;
    }

    function touchLoadedTile(key,needed){
      const entry=pixelTileLayer.tiles.get(key);
      if(!entry)return false;
      pixelTileLayer.tiles.delete(key);pixelTileLayer.tiles.set(key,entry);
      entry.hidden=false;
      tileUsage.set(key,++usageTick);needed.add(key);
      return true;
    }
    function evictTileCache(needed){
      // ponytail: retain 256 textures (~64 MiB) plus any larger currently visible set.
      const limit=Math.max(maxCachedTiles,needed.size);
      if(pixelTileLayer.tiles.size<=limit)return;
      const candidates=[...pixelTileLayer.tiles.keys()]
        .filter(key=>!needed.has(key))
        .sort((a,b)=>(tileUsage.get(a)||0)-(tileUsage.get(b)||0));
      for(const key of candidates){
        if(pixelTileLayer.tiles.size<=limit)break;
        pixelTileLayer.removeTile(key);tileUsage.delete(key);
      }
    }
    function clearTileCache(){
      refreshGeneration++;
      if(refreshController)refreshController.abort();
      refreshController=null;
      if(moveRefreshTimer){clearTimeout(moveRefreshTimer);moveRefreshTimer=0}
      if(pixelTileLayer)pixelTileLayer.clear();
      tileUsage.clear();usageTick=0;displayedLevel=null;lastViewportSignature='';
    }

    async function loadTargetTile(version,z,x,y,world,generation,fetches,visible,signal,background,allowFallback){
      const key=`${version}/${z}/${x}/${y}@${world}`,fallbackKey=`fallback/${version}/${z}/${x}/${y}@${world}`;
      if(touchLoadedTile(key,visible)){
        if(pixelTileLayer.hasTile(fallbackKey)){pixelTileLayer.removeTile(fallbackKey);tileUsage.delete(fallbackKey)}
        return;
      }
      const reusedFallback=touchLoadedTile(fallbackKey,visible);
      let suppressFallback=false;
      const detailPromise=fetchTileBlob(version,z,x,y,fetches,signal)
        .then(async blob=>{
          if(blob===null){suppressFallback=true;return {kind:'detail',blob:null}}
          try{
            const bitmap=await createImageBitmap(blob,{imageOrientation:'flipY'});
            suppressFallback=true;return {kind:'detail',bitmap};
          }catch(error){
            if(error.name!=='AbortError')console.error('Failed to decode detail tile',error);
            return {kind:'detail',error};
          }
        })
        .catch(error=>{if(error.name!=='AbortError')console.error(error);return {kind:'detail',error}});
      const fallbackPromise=(reusedFallback||!allowFallback?Promise.resolve(null):
        new Promise(resolve=>setTimeout(resolve,fallbackDelayMs))
          .then(()=>suppressFallback||signal.aborted?null:loadFallbackForTile(version,z,x,y,world,generation,fetches,signal)))
        .then(tile=>({kind:'fallback',tile}));
      const removeFallback=()=>{
        if(pixelTileLayer.hasTile(fallbackKey))pixelTileLayer.removeTile(fallbackKey);
        tileUsage.delete(fallbackKey);visible.delete(fallbackKey);
      };
      const applyFallback=result=>{
        if(!result||!result.tile)return;
        if(generation!==refreshGeneration){result.tile.bitmap.close();return}
        pixelTileLayer.setTile(result.tile.key,result.tile.bitmap,result.tile.corners);result.tile.bitmap.close();
        if(pixelTileLayer.hasTile(result.tile.key))touchLoadedTile(result.tile.key,visible);
      };
      const applyDetail=async result=>{
        if(generation!==refreshGeneration||!result||result.error)return false;
        if(result.blob===null){removeFallback();return true}
        const bitmap=result.bitmap;
        if(!bitmap)return false;
        if(generation!==refreshGeneration){bitmap.close();return false}
        pixelTileLayer.setTile(key,bitmap,nativeTileCorners(z,x,y,world));bitmap.close();
        if(pixelTileLayer.hasTile(key))touchLoadedTile(key,visible);
        removeFallback();return true;
      };
      const first=await Promise.race([detailPromise,fallbackPromise]);
      if(generation!==refreshGeneration){
        if(first.kind==='fallback'){
          if(first.tile)first.tile.bitmap.close();
          background.push(detailPromise.then(result=>{if(result.bitmap)result.bitmap.close()}));
        }else{
          if(first.bitmap)first.bitmap.close();
          background.push(fallbackPromise.then(result=>{if(result.tile)result.tile.bitmap.close()}));
        }
        return;
      }
      if(first.kind==='detail'){
        if(await applyDetail(first)){
          background.push(fallbackPromise.then(result=>{if(result.tile)result.tile.bitmap.close()}));return;
        }
        if(reusedFallback)return;
        applyFallback(await fallbackPromise);return;
      }
      applyFallback(first);
      await applyDetail(await detailPromise);
    }

    async function runTilePool(items,worker){
      let cursor=0;
      const run=async()=>{
        while(cursor<items.length){
          const index=cursor++;
          await worker(items[index]);
        }
      };
      await Promise.all(Array.from({length:Math.min(tileLoadConcurrency,items.length)},run));
    }

    async function refreshTiles(allowFallback=true){
      if(!pixelTileLayer||!archiveVersion)return;
      if(refreshController)refreshController.abort();
      const controller=new AbortController();refreshController=controller;
      const generation=++refreshGeneration,z=dataLevel(),visible=new Set(),fetches=new Map(),background=[];
      lastViewportSignature=viewportSignature();
      const targets=visibleNativeTiles(map.getBounds(),z);
      if(displayedLevel!==z)for(const entry of pixelTileLayer.tiles.values())entry.hidden=true;
      if(pixelTileLayer.map)pixelTileLayer.map.triggerRepaint();
      await runTilePool(targets,({x,y,world})=>loadTargetTile(archiveVersion,z,x,y,world,generation,fetches,visible,controller.signal,background,allowFallback));
      if(generation!==refreshGeneration)return;
      for(const [key,entry] of pixelTileLayer.tiles){
        if(key.startsWith('fallback/')&&!visible.has(key)){pixelTileLayer.removeTile(key);tileUsage.delete(key);continue}
        entry.hidden=!visible.has(key);
      }
      if(pixelTileLayer.map)pixelTileLayer.map.triggerRepaint();
      evictTileCache(visible);
      displayedLevel=z;
      Promise.allSettled(background).then(()=>{if(refreshController===controller)refreshController=null});
    }

    function showVersion(id){
      archiveVersion=String(id);
      clearTileCache();
      params.set('version',archiveVersion);history.replaceState(null,'',`${location.pathname}?${params}`);
      refreshTiles();
    }
    function updateUrl(){
      const center=map.getCenter();params.set('lng',center.lng.toFixed(6));params.set('lat',center.lat.toFixed(6));params.set('zoom',map.getZoom().toFixed(2));
      history.replaceState(null,'',`${location.pathname}?${params}`);
    }

    map.on('style.load',()=>{
      map.setProjection({type:'mercator'});
      if(pixelTileLayer&&!map.getLayer(pixelTileLayer.id)){clearTileCache();map.addLayer(pixelTileLayer);refreshTiles()}
    });
    map.on('load',async()=>{
      pixelTileLayer=new PixelTileLayer('pixel-tiles');
      pixelTileLayer.softness=1.0;
      map.addLayer(pixelTileLayer);
      try{
        const response=await fetch('/api/versions'),versions=await response.json();
        if(!versions.length)throw new Error('No versions ingested');
        for(const version of versions){const option=document.createElement('option');option.value=version.id;option.textContent=`${version.label} (${version.eventCount.toLocaleString()} events)`;select.append(option)}
        select.value=params.get('version')||versions.at(-1).id;showVersion(select.value);select.onchange=()=>showVersion(select.value);status.textContent='';
      }catch(error){status.textContent=error.message}
    });
    map.on('move',()=>scheduleTileRefresh(false));
    map.on('moveend',()=>scheduleTileRefresh(true));
    map.on('moveend',updateUrl);
  </script>
</body>
</html>
