<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GeoPixels archive</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.css">
  <style>
    html,body,#map{height:100%;margin:0} body{font:14px system-ui,sans-serif}
    #controls{position:absolute;z-index:2;top:10px;left:10px;display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:6px;background:#fffffff0;box-shadow:0 1px 5px #0005}
    select{font:inherit;max-width:220px} #status{color:#555;font-variant-numeric:tabular-nums}
    #credit{display:flex;align-items:center;height:23px;padding:0 8px;border-radius:12px;background:#000c;color:#e1e3e9;box-sizing:border-box}
    .context-link{color:#111;font-weight:600;text-decoration:none;white-space:nowrap}
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="controls"><strong>GeoPixels</strong><label>Version <select id="version"></select></label><span id="status">Loading…</span></div>
  <script src="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.js"></script>
  <script src="/pixel-tile-layer.js"></script>
  <script>
    const appVersion='0.1.0';
    const gridSize=25,tileSize=256,maxDataZoom=13,earthRadius=6378137,mercatorHalfWorld=Math.PI*earthRadius;
    const params=new URLSearchParams(location.search);
    const select=document.querySelector('#version'),status=document.querySelector('#status');
    let pixelTileLayer=null,archiveVersion=null,refreshGeneration=0,displayedLevel=null,lastViewportSignature='',activeRefresh=null;
    const maxCachedTiles=256;
    const fallbackDelayMs=300;
    const tileLoadConcurrency=4;
    const moveRefreshDelayMs=100;
    const tileUsage=new Map();
    const missingTiles=new Set();
    const inFlightTiles=new Map();
    let usageTick=0,moveRefreshTimer=0,retryTimer=0;
    const map=new maplibregl.Map({container:'map',center:[+(params.get('lng')||0),+(params.get('lat')||0)],zoom:+(params.get('zoom')||1),renderWorldCopies:true,dragRotate:false,style:'/map-style.json'});
    map.addControl(new maplibregl.NavigationControl());
    const credit=document.createElement('div');credit.id='credit';credit.className='maplibregl-ctrl';credit.textContent=`By Azael - V${appVersion}`;
    map.addControl({onAdd:()=>credit,onRemove:()=>credit.remove()},'bottom-left');

    const clamp=(value,min,max)=>Math.max(min,Math.min(max,value));
    const cellsPerTile=z=>tileSize*Math.pow(2,maxDataZoom-z);
    const lngToMercatorX=lng=>clamp(lng/180*mercatorHalfWorld,-mercatorHalfWorld,mercatorHalfWorld);
    const latToMercatorY=lat=>{
      const radians=clamp(lat,-85.05112878,85.05112878)*Math.PI/180;
      return earthRadius*Math.log(Math.tan(Math.PI/4+radians/2));
    };
    const contextPopup=new maplibregl.Popup({closeButton:false});
    map.on('contextmenu',e=>{
      e.originalEvent.preventDefault();
      const point=e.lngLat.wrap(),x=Math.round(lngToMercatorX(point.lng)/gridSize),y=Math.round(latToMercatorY(point.lat)/gridSize);
      contextPopup.setLngLat(e.lngLat).setHTML(`<a class="context-link" href="https://geopixels.net/?coords=${x},${y}" target="_blank" rel="noopener">Open on GeoPixels</a>`).addTo(map);
    });
    function projectedToLngLat(mx,my){
      return [mx/earthRadius*180/Math.PI,(2*Math.atan(Math.exp(my/earthRadius))-Math.PI/2)*180/Math.PI];
    }
    function nativeTileRange(bounds,z){
      const span=cellsPerTile(z);
      const west=lngToMercatorX(bounds.getWest()),east=lngToMercatorX(bounds.getEast());
      const south=latToMercatorY(bounds.getSouth()),north=latToMercatorY(bounds.getNorth());
      const tileFor=(mx,my)=>[Math.floor((mx/gridSize+0.5)/span),Math.floor((my/gridSize+0.5)/span)];
      const [minX,minY]=tileFor(Math.min(west,east),south),[maxX,maxY]=tileFor(Math.max(west,east),north);
      return {minX,maxX,minY,maxY};
    }
    function visibleNativeTiles(bounds,z){
      const tiles=[],west=bounds.getWest(),east=bounds.getEast()<west?bounds.getEast()+360:bounds.getEast();
      const firstWorld=Math.floor((bounds.getWest()+180)/360),lastWorld=Math.floor((east+180)/360);
      for(let world=firstWorld;world<=lastWorld;world++){
        const offset=world*360,worldWest=-180+offset,worldEast=180+offset;
        const localBounds={
          getWest:()=>Math.max(west,worldWest)-offset,
          getEast:()=>Math.min(east,worldEast)-offset,
          getSouth:()=>bounds.getSouth(),getNorth:()=>bounds.getNorth()
        };
        const range=nativeTileRange(localBounds,z);
        for(let x=range.minX;x<=range.maxX;x++)for(let y=range.minY;y<=range.maxY;y++)tiles.push({x,y,world});
      }
      return tiles;
    }
    function prioritizeNativeTiles(tiles,z,bounds){
      const west=bounds.getWest(),east=bounds.getEast()<west?bounds.getEast()+360:bounds.getEast();
      const centerX=(west+east)/360*mercatorHalfWorld;
      const centerY=(latToMercatorY(bounds.getSouth())+latToMercatorY(bounds.getNorth()))/2;
      const span=cellsPerTile(z),worldWidth=2*mercatorHalfWorld;
      const distance=({x,y,world})=>{
        const dx=(x*span+(span-1)/2)*gridSize+world*worldWidth-centerX;
        const dy=(y*span+(span-1)/2)*gridSize-centerY;
        return dx*dx+dy*dy;
      };
      return tiles.map((tile,index)=>({tile,index,distance:distance(tile)}))
        .sort((a,b)=>a.distance-b.distance||a.index-b.index).map(({tile})=>tile);
    }
    function nativeTileCorners(z,x,y,world=0){
      const span=cellsPerTile(z),gx0=x*span,gy0=y*span;
      // Grid coordinates are cell centres, so native tile boundaries are half a cell outside.
      const west=(gx0-0.5)*gridSize,east=(gx0+span-0.5)*gridSize;
      const south=(gy0-0.5)*gridSize,north=(gy0+span-0.5)*gridSize;
      return [projectedToLngLat(west,south),projectedToLngLat(east,south),projectedToLngLat(east,north),projectedToLngLat(west,north)]
        .map(([lng,lat])=>[lng+world*360,lat]);
    }
    const nativeZoomThreshold=10.5;
    const movingDataLevel=()=>map.getZoom()>=nativeZoomThreshold?maxDataZoom:clamp(Math.floor(map.getZoom()),0,maxDataZoom);
    const settledDataLevel=()=>map.getZoom()>=nativeZoomThreshold?maxDataZoom:clamp(movingDataLevel()+1,0,maxDataZoom);
    function viewportSignature(z=movingDataLevel()){
      return `${archiveVersion}/${z}/`+visibleNativeTiles(map.getBounds(),z).map(({x,y,world})=>`${x}/${y}@${world}`).join(',');
    }
    function scheduleTileRefresh(settled){
      if(!pixelTileLayer||!archiveVersion)return;
      if(settled){
        // A user/load settle starts a fresh retry context. Automatic retries
        // call refreshTiles directly, so they keep their current attempt count.
        cancelNativeRetry();nativeRetryAttempt=0;
        if(moveRefreshTimer){clearTimeout(moveRefreshTimer);moveRefreshTimer=0}
        const version=archiveVersion,coarseZ=movingDataLevel(),coarseSignature=viewportSignature(coarseZ);
        const coarse=activeRefresh&&activeRefresh.signature===coarseSignature?
          activeRefresh.promise.then(complete=>complete?true:
            version===archiveVersion&&coarseSignature===viewportSignature(coarseZ)&&refreshTiles(coarseZ,true)):
          lastViewportSignature===coarseSignature&&displayedLevel===coarseZ?Promise.resolve(true):refreshTiles(coarseZ,true);
        Promise.resolve(coarse).then(complete=>{
          // ponytail: an incomplete native settle (transient failure) retries
          // itself instead of waiting for a gesture; any signature/version/
          // zoom drift inside the retry re-check kills it. 204s and empty
          // regions complete, so they never enter this path. Completed coarse
          // settles still fall through to the split detail pass below.
          if(!complete){
            if(version===archiveVersion&&coarseSignature===viewportSignature(coarseZ)&&coarseZ===maxDataZoom&&map.getZoom()>=nativeZoomThreshold)scheduleNativeRetry(coarseZ);
            return;
          }
          if(version!==archiveVersion||coarseSignature!==viewportSignature(coarseZ))return;
          const detailZ=settledDataLevel();
          if(detailZ!==coarseZ)refreshTiles(detailZ,false);
        });
        return;
      }
      if(moveRefreshTimer)return;
      moveRefreshTimer=setTimeout(()=>{
        moveRefreshTimer=0;
        const z=movingDataLevel(),signature=viewportSignature(z);
        if(signature===lastViewportSignature)return;
        refreshTiles(z,z===maxDataZoom&&map.getZoom()>=nativeZoomThreshold);
      },moveRefreshDelayMs);
    }

    // Bounded automatic retry for incomplete native (z13) settles.
    const nativeRetryMaxAttempts=3,nativeRetryDelayMs=2000;
    let nativeRetryAttempt=0,nativeRetryEpoch=0;
    function cancelNativeRetry(){if(retryTimer){clearTimeout(retryTimer);retryTimer=0}nativeRetryEpoch++}
    function scheduleNativeRetry(detailZ){
      cancelNativeRetry();
      if(lastViewportSignature===viewportSignature(detailZ)){nativeRetryAttempt=0;return} // completed
      if(detailZ!==maxDataZoom||map.getZoom()<nativeZoomThreshold)return;
      if(nativeRetryAttempt>=nativeRetryMaxAttempts)return;
      const epoch=nativeRetryEpoch,version=archiveVersion,signature=viewportSignature(detailZ),zoom=map.getZoom();
      retryTimer=setTimeout(async()=>{
        retryTimer=0;
        // ponytail: retry identity is its own epoch, decoupled from
        // refreshGeneration — the retry's own refresh bumps the generation by
        // design and must not look like external invalidation. In-flight
        // sharing + supersede-by-signature still dedupe redundant calls.
        if(epoch!==nativeRetryEpoch||version!==archiveVersion)return;
        if(zoom!==map.getZoom()||map.getZoom()<nativeZoomThreshold||settledDataLevel()!==detailZ)return;
        if(signature!==viewportSignature(detailZ))return;
        const complete=await refreshTiles(detailZ,true);
        if(epoch!==nativeRetryEpoch||version!==archiveVersion)return;
        if(zoom!==map.getZoom()||signature!==viewportSignature(detailZ)||settledDataLevel()!==detailZ)return;
        if(complete){nativeRetryAttempt=0;return}
        nativeRetryAttempt++;
        scheduleNativeRetry(detailZ);
      },nativeRetryDelayMs*Math.pow(2,nativeRetryAttempt));
    }

    const tileURL=(version,z,x,y)=>`/tiles/${version}/${z}/${x}/${y}.png?optional=1`;
    async function fetchTileBlob(version,z,x,y,fetches){
      const url=tileURL(version,z,x,y);
      if(missingTiles.has(url))return null;
      if(fetches.has(url))return fetches.get(url);
      const existing=inFlightTiles.get(url);
      let promise=existing&&existing.promise;
      if(!promise){
        const controller=new AbortController();
        promise=(async()=>{
          const response=await fetch(url,{signal:controller.signal});
          if(response.status===204||response.status===404){
            missingTiles.add(url);
            if(missingTiles.size>5000)missingTiles.delete(missingTiles.values().next().value);
            return null;
          }
          if(!response.ok)throw new Error(`Tile ${z}/${x}/${y}: ${response.status}`);
          return response.blob();
        })().finally(()=>{if(inFlightTiles.get(url)?.promise===promise)inFlightTiles.delete(url)});
        inFlightTiles.set(url,{controller,promise});
      }
      fetches.set(url,promise);
      return promise;
    }
    function abortObsoleteTileRequests(keep){
      for(const [url,request] of inFlightTiles){
        if(keep.has(url))continue;
        request.controller.abort();inFlightTiles.delete(url);
      }
    }

    const floorMod=(value,divisor)=>((value%divisor)+divisor)%divisor;
    async function cropParentTile(blob,x,y,delta){
      const scale=Math.pow(2,delta),sourceSize=tileSize/scale;
      // Source PNG is north-up; native Y grows north, while bitmap crop Y grows down.
      const sourceX=floorMod(x,scale)*sourceSize,sourceY=(scale-1-floorMod(y,scale))*sourceSize;
      return createImageBitmap(blob,sourceX,sourceY,sourceSize,sourceSize,{
        imageOrientation:'flipY',resizeWidth:tileSize,resizeHeight:tileSize,resizeQuality:'pixelated'
      });
    }

    async function loadFallbackForTile(version,z,x,y,world,generation,fetches,fallbackStatus){
      for(let delta=1;delta<=2&&z-delta>=0;delta++){
        const scale=Math.pow(2,delta),parentZ=z-delta,parentX=Math.floor(x/scale),parentY=Math.floor(y/scale);
        try{
          const blob=await fetchTileBlob(version,parentZ,parentX,parentY,fetches);
          if(generation!==refreshGeneration)return null;
          if(!blob)continue;
          const bitmap=await cropParentTile(blob,x,y,delta);
          if(generation!==refreshGeneration){bitmap.close();return null}
          return {key:`fallback/${version}/${z}/${x}/${y}@${world}`,bitmap,corners:nativeTileCorners(z,x,y,world)};
        }catch(error){
          if(error.name!=='AbortError')console.error(error);
          if(generation!==refreshGeneration)return null;
          fallbackStatus.hadError=true;
        }
      }
      return null;
    }

    function touchLoadedTile(key,needed,hidden=false){
      const entry=pixelTileLayer.tiles.get(key);
      if(!entry)return false;
      pixelTileLayer.tiles.delete(key);pixelTileLayer.tiles.set(key,entry);
      entry.hidden=hidden;
      tileUsage.set(key,++usageTick);needed.add(key);
      return true;
    }
    function evictTileCache(needed){
      // ponytail: retain 256 textures (~64 MiB) plus any larger currently visible set.
      const limit=Math.max(maxCachedTiles,needed.size);
      if(pixelTileLayer.tiles.size<=limit)return;
      const candidates=[...pixelTileLayer.tiles.keys()]
        .filter(key=>!needed.has(key))
        .sort((a,b)=>(tileUsage.get(a)||0)-(tileUsage.get(b)||0));
      for(const key of candidates){
        if(pixelTileLayer.tiles.size<=limit)break;
        pixelTileLayer.removeTile(key);tileUsage.delete(key);
      }
    }
    function clearTileCache(){
      refreshGeneration++;
      for(const request of inFlightTiles.values())request.controller.abort();
      inFlightTiles.clear();activeRefresh=null;
      cancelNativeRetry();nativeRetryAttempt=0;
      if(moveRefreshTimer){clearTimeout(moveRefreshTimer);moveRefreshTimer=0}
      if(pixelTileLayer)pixelTileLayer.clear();
      tileUsage.clear();usageTick=0;displayedLevel=null;lastViewportSignature='';
    }

    async function loadTargetTile(version,z,x,y,world,generation,fetches,visible,background,allowFallback,stage,coverageReady){
      const key=`${version}/${z}/${x}/${y}@${world}`,fallbackKey=`fallback/${version}/${z}/${x}/${y}@${world}`;
      const retainMissingFallback=z===maxDataZoom&&map.getZoom()>=nativeZoomThreshold;
      if(touchLoadedTile(key,visible,stage)){
        if(pixelTileLayer.hasTile(fallbackKey)){pixelTileLayer.removeTile(fallbackKey);tileUsage.delete(fallbackKey)}
        if(coverageReady)coverageReady(key);
        return true;
      }
      const reusedFallback=touchLoadedTile(fallbackKey,visible,stage);
      if(reusedFallback&&coverageReady)coverageReady(fallbackKey);
      let suppressFallback=false;
      const fallbackStatus={hadError:false};
      const detailPromise=fetchTileBlob(version,z,x,y,fetches)
        .then(async blob=>{
          if(generation!==refreshGeneration)return {kind:'detail',stale:true}
          if(blob===null){if(!retainMissingFallback)suppressFallback=true;return {kind:'detail',blob:null}}
          try{
            const bitmap=await createImageBitmap(blob,{imageOrientation:'flipY'});
            suppressFallback=true;return {kind:'detail',bitmap};
          }catch(error){
            if(error.name!=='AbortError')console.error('Failed to decode detail tile',error);
            return {kind:'detail',error};
          }
        })
        .catch(error=>{if(error.name!=='AbortError')console.error(error);return {kind:'detail',error}});
      const fallbackPromise=(reusedFallback||!allowFallback?Promise.resolve(null):
        new Promise(resolve=>setTimeout(resolve,fallbackDelayMs))
          .then(()=>suppressFallback||generation!==refreshGeneration?null:loadFallbackForTile(version,z,x,y,world,generation,fetches,fallbackStatus)))
        .then(tile=>({kind:'fallback',tile}));
      const removeFallback=()=>{
        if(pixelTileLayer.hasTile(fallbackKey))pixelTileLayer.removeTile(fallbackKey);
        tileUsage.delete(fallbackKey);visible.delete(fallbackKey);
      };
      const applyFallback=result=>{
        if(!result||!result.tile)return false;
        if(result.tile.key===fallbackKey)removeFallback();
        if(generation!==refreshGeneration){closeFallbackResult(result);return false}
        pixelTileLayer.setTile(result.tile.key,result.tile.bitmap,result.tile.corners);
        closeBitmap(result.tile.bitmap);
        // Upload consumed the bitmap — null it so later cleanup can't double-close.
        result.tile.bitmap=null;
        if(pixelTileLayer.hasTile(result.tile.key))touchLoadedTile(result.tile.key,visible,stage);
        if(coverageReady)coverageReady(result.tile.key);
        return true;
      };
      const applyDetail=async result=>{
        if(!result||result.error)return false;
        if(generation!==refreshGeneration){if(result.bitmap)result.bitmap.close();return false}
        if(result.blob===null){
          // ponytail: an intentional 204 counts as done only when fallback
          // coverage exists (or is disallowed); otherwise the region would
          // never complete and every refresh would restage it.
          if(retainMissingFallback)return pixelTileLayer.hasTile(fallbackKey)||reusedFallback;
          removeFallback();return true;
        }
        const bitmap=result.bitmap;
        if(!bitmap)return false;
        pixelTileLayer.setTile(key,bitmap,nativeTileCorners(z,x,y,world));bitmap.close();
        if(pixelTileLayer.hasTile(key))touchLoadedTile(key,visible,stage);
        removeFallback();if(coverageReady)coverageReady(key);return true;
      };
      const closeBitmap=bitmap=>{if(bitmap&&typeof bitmap.close==='function')bitmap.close()};
      // ponytail: ownership via consumption — applyFallback nulls the bitmap after
      // upload, so closeFallbackResult closes anything still holding one (fresh
      // discarded fallbacks included) and never double-closes uploaded tiles.
      const closeFallbackResult=result=>{
        if(!result||!result.tile)return;
        if(result.tile.key===fallbackKey&&pixelTileLayer.hasTile(fallbackKey))return; // live reused/retained fallback tile, not a fresh bitmap
        closeBitmap(result.tile.bitmap);result.tile.bitmap=null;
      };
      const first=await Promise.race([detailPromise,fallbackPromise]);
      if(generation!==refreshGeneration){
        if(first.kind==='fallback'){
          closeFallbackResult(first);
          background.push(detailPromise.then(result=>{closeBitmap(result.bitmap)}));
        }else{
          closeBitmap(first.bitmap);
          background.push(fallbackPromise.then(result=>{closeFallbackResult(result)}));
        }
        return false;
      }
      if(first.kind==='detail'){
        if(await applyDetail(first)){
          background.push(fallbackPromise.then(result=>{closeFallbackResult(result)}));return true;
        }
        // ponytail: never report a failed native tile as done just because z12 covered it;
        // recording completion would suppress all retries of that tile.
        const failedNative=first.error&&z===maxDataZoom&&map.getZoom()>=nativeZoomThreshold;
        if(failedNative){
          // ponytail: native failure must not cancel its z12 fallback — the
          // delayed fallback result becomes visible coverage (kept retriable),
          // and the refresh stays incomplete so a later attempt can retry.
          if(reusedFallback)return false;
          background.push(fallbackPromise.then(result=>{
            if(generation===refreshGeneration)applyFallback(result);else closeFallbackResult(result);
          }));
          return false;
        }
        if(reusedFallback)return true;
        // ponytail: intentional 204 with no fallback either (204 all the way up)
        // means the cell is genuinely empty — count it done instead of blocking
        // completion forever; refreshes then sweep leftovers instead of restaging.
        const fbResult=await fallbackPromise;

        if(generation!==refreshGeneration)return false;

        if(
          !fbResult?.tile &&
          first.blob===null &&
          retainMissingFallback &&
          !pixelTileLayer.hasTile(fallbackKey) &&
          !fallbackStatus.hadError
        ){
          if(coverageReady)coverageReady(null);
          return true;
        }

        return applyFallback(fbResult);
      }
      // ponytail: never report a failed native tile as done just because z12 covered it;
      // recording completion would suppress all retries of that tile.
      const nativeFailed=result=>!!(result&&result.error&&z===maxDataZoom&&map.getZoom()>=nativeZoomThreshold);
      const fallbackApplied=applyFallback(first);
      const detailResult=await detailPromise;
      if(await applyDetail(detailResult))return true;
      if(nativeFailed(detailResult))return false;
      return fallbackApplied;
    }

    async function runTilePool(items,worker){
      let cursor=0;
      const results=new Array(items.length);
      const run=async()=>{
        while(cursor<items.length){
          const index=cursor++;
          results[index]=await worker(items[index]);
        }
      };
      await Promise.all(Array.from({length:Math.min(tileLoadConcurrency,items.length)},run));
      return results;
    }

    async function performRefresh(version,z,signature,allowFallback){
      const generation=++refreshGeneration;
      const fetches=new Map(),visible=new Set(),background=[];
      const settledCoverage=new Set();
      const bounds=map.getBounds(),targets=prioritizeNativeTiles(visibleNativeTiles(bounds,z),z,bounds);
      const progressiveNative=z===maxDataZoom&&map.getZoom()>=nativeZoomThreshold;
      // ponytail: transitional groups use z12 (one level under the native
      // target) instead of displayedLevel — a z11 parent spans 16 z13 children,
      // so one slow child could withhold 15 ready siblings; z12 regions cap
      // that blast radius at 4 while keeping parent-atomic reveal.
      const transitionLevel=progressiveNative&&displayedLevel!==null&&displayedLevel<z?z-1:null;
      const stage=displayedLevel!==null&&displayedLevel!==z;
      const targetGroups=new Map(),coverageGroups=new Map(),targetCoarseGroups=new Map(),coarseGroups=new Map();
      let markCoverage=()=>{};
      if(transitionLevel!==null){
        const scale=Math.pow(2,z-transitionLevel);
        const coarseScale=displayedLevel<transitionLevel?Math.pow(2,z-displayedLevel):0;
        for(const {x,y,world} of targets){
          const targetId=`${x}/${y}@${world}`;
          const parentX=Math.floor(x/scale),parentY=Math.floor(y/scale);
          const groupId=`${parentX}/${parentY}@${world}`;
          let group=coverageGroups.get(groupId);
          if(!group){
            const parentKey=`${version}/${transitionLevel}/${parentX}/${parentY}@${world}`;
            group={parentKeys:[parentKey,`fallback/${parentKey}`],targets:new Set(),ready:new Set(),current:new Map(),revealed:false,settled:new Map()};
            coverageGroups.set(groupId,group);
          }
          group.targets.add(targetId);targetGroups.set(targetId,group);
          if(coarseScale){
            const coarseX=Math.floor(x/coarseScale),coarseY=Math.floor(y/coarseScale);
            const coarseId=`${coarseX}/${coarseY}@${world}`;
            let coarse=coarseGroups.get(coarseId);
            if(!coarse){
              const parentKey=`${version}/${displayedLevel}/${coarseX}/${coarseY}@${world}`;
              coarse={parentKeys:[parentKey,`fallback/${parentKey}`],targets:new Set(),ready:new Set(),groups:new Set(),revealed:false};
              coarseGroups.set(coarseId,coarse);
            }
            coarse.targets.add(targetId);coarse.groups.add(group);group.coarse=coarse;targetCoarseGroups.set(targetId,coarse);
          }
          const childBase=`${version}/${z}/${x}/${y}@${world}`;
          // An earlier refresh may have already revealed this child (or its
          // retained fallback): keep it settled instead of flashing coarse.
          const live=pixelTileLayer.tiles.get(childBase)||pixelTileLayer.tiles.get(`fallback/${childBase}`);
          if(live&&!live.hidden){
            group.settled.set(targetId,live);settledCoverage.add(live===pixelTileLayer.tiles.get(childBase)?childBase:`fallback/${childBase}`);
            const coarse=targetCoarseGroups.get(targetId);if(coarse)coarse.ready.add(targetId);
            continue;
          }
          for(const childKey of [childBase,`fallback/${childBase}`]){
            const entry=pixelTileLayer.tiles.get(childKey);if(entry)entry.hidden=true;
          }
        }
        const groupCovered=group=>[...group.targets].every(id=>group.ready.has(id)||group.settled.has(id));
        const revealGroup=group=>{
          if(group.revealed)return;
          for(const parentKey of group.parentKeys){const entry=pixelTileLayer.tiles.get(parentKey);if(entry)entry.hidden=true}
          for(const entry of group.settled.values())entry.hidden=false;
          for(const childKey of group.current.values()){const entry=pixelTileLayer.tiles.get(childKey);if(entry)entry.hidden=false}
          group.revealed=true;
        };
        const revealCoarse=coarse=>{
          if(coarse.revealed)return;
          for(const parentKey of coarse.parentKeys){const entry=pixelTileLayer.tiles.get(parentKey);if(entry)entry.hidden=true}
          coarse.revealed=true;
          for(const group of coarse.groups)if(groupCovered(group))revealGroup(group);
        };
        for(const coarse of coarseGroups.values()){
          if(coarse.ready.size===coarse.targets.size)revealCoarse(coarse);
          else for(const parentKey of coarse.parentKeys){const entry=pixelTileLayer.tiles.get(parentKey);if(entry)entry.hidden=false}
        }
        for(const group of coverageGroups.values()){
          if(groupCovered(group)&&(!group.coarse||group.coarse.revealed))revealGroup(group);
          else if(!group.revealed)for(const parentKey of group.parentKeys){const entry=pixelTileLayer.tiles.get(parentKey);if(entry)entry.hidden=false}
        }
        markCoverage=(targetId,key)=>{
          const group=targetGroups.get(targetId);if(!group)return;
          group.ready.add(targetId);if(key)group.current.set(targetId,key);
          const coarse=targetCoarseGroups.get(targetId);if(coarse)coarse.ready.add(targetId);
          if(group.revealed){if(key){const entry=pixelTileLayer.tiles.get(key);if(entry)entry.hidden=false}return}
          if(coarse&&!coarse.revealed){
            if(coarse.ready.size!==coarse.targets.size)return;
            revealCoarse(coarse);
          }else if(groupCovered(group))revealGroup(group);
          if(pixelTileLayer.map)pixelTileLayer.map.triggerRepaint();
        };
      }
      const keep=new Set();
      for(const {x,y} of targets){
        keep.add(tileURL(version,z,x,y));
        if(!allowFallback)continue;
        for(let delta=1;delta<=2&&z-delta>=0;delta++){
          const scale=Math.pow(2,delta);
          keep.add(tileURL(version,z-delta,Math.floor(x/scale),Math.floor(y/scale)));
        }
      }
      abortObsoleteTileRequests(keep);
      const results=await runTilePool(targets,({x,y,world})=>generation===refreshGeneration&&
        loadTargetTile(version,z,x,y,world,generation,fetches,visible,background,allowFallback,stage,
          targetGroups.size?key=>markCoverage(`${x}/${y}@${world}`,key):null));
      if(version!==archiveVersion||generation!==refreshGeneration)return false;
      const complete=results.every(Boolean);
      if(!complete&&stage)return false;
      if(complete){
        // ponytail: below the native threshold a completed coarse refresh hides
        // (but keeps cached) higher-level native tiles so they stop costing GPU
        // draw calls under the coarser coverage; zooming back reuses them.
        const hideNatives=!progressiveNative&&z<maxDataZoom;
        // ponytail: sweep hides/removes only entries at or below this refresh's
        // level; already-native higher-level coverage survives coarse settles.
        // settledCoverage spares already-revealed children/retained fallbacks of
        // this refresh's own targets; everything else same-level or coarser gets
        // re-judged so mid-gesture coarse leftovers can't linger on top.
        for(const [key,entry] of pixelTileLayer.tiles){
          const seg=key.startsWith('fallback/')?key.slice('fallback/'.length):key;
          const level=Number(seg.split('/')[1]);
          if(hideNatives&&level>z&&!visible.has(key)){entry.hidden=true;continue}
          if(level>z&&!visible.has(key))continue;
          if(settledCoverage.has(key)||visible.has(key)){entry.hidden=false;continue}
          if(key.startsWith('fallback/')&&level<=z){pixelTileLayer.removeTile(key);tileUsage.delete(key);continue}
          entry.hidden=true;
        }
        displayedLevel=z;lastViewportSignature=signature;
        if(pixelTileLayer.map)pixelTileLayer.map.triggerRepaint();
        evictTileCache(visible);
      }
      Promise.allSettled(background);
      return complete;
    }

    function refreshTiles(z,allowFallback=true){
      if(!pixelTileLayer||!archiveVersion)return Promise.resolve(false);
      const version=archiveVersion,signature=viewportSignature(z);
      if(activeRefresh&&activeRefresh.signature===signature)return activeRefresh.promise;
      const promise=performRefresh(version,z,signature,allowFallback);
      activeRefresh={signature,promise};
      promise.finally(()=>{if(activeRefresh?.promise===promise)activeRefresh=null});
      return promise;
    }

    function showVersion(id){
      archiveVersion=String(id);
      clearTileCache();
      params.set('version',archiveVersion);history.replaceState(null,'',`${location.pathname}?${params}`);
      scheduleTileRefresh(true);
    }
    function updateUrl(){
      const center=map.getCenter();params.set('lng',center.lng.toFixed(6));params.set('lat',center.lat.toFixed(6));params.set('zoom',map.getZoom().toFixed(2));
      history.replaceState(null,'',`${location.pathname}?${params}`);
    }

    map.on('style.load',()=>{
      map.setProjection({type:'mercator'});
      if(pixelTileLayer&&!map.getLayer(pixelTileLayer.id)){clearTileCache();map.addLayer(pixelTileLayer);scheduleTileRefresh(true)}
    });
    map.on('load',async()=>{
      pixelTileLayer=new PixelTileLayer('pixel-tiles');
      pixelTileLayer.softness=1.0;
      map.addLayer(pixelTileLayer);
      try{
        const response=await fetch('/api/versions'),versions=await response.json();
        if(!versions.length)throw new Error('No versions ingested');
        for(const version of versions){const option=document.createElement('option');option.value=version.id;option.textContent=`${version.label} (${version.eventCount.toLocaleString()} events)`;select.append(option)}
        select.value=params.get('version')||versions.at(-1).id;showVersion(select.value);select.onchange=()=>showVersion(select.value);status.textContent='';
      }catch(error){status.textContent=error.message}
    });
    map.on('move',()=>scheduleTileRefresh(false));
    map.on('moveend',()=>scheduleTileRefresh(true));
    map.on('moveend',updateUrl);
  </script>
</body>
</html>
